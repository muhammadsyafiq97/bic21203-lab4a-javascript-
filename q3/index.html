<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 4a Q3 - Dynamic Number Generator</title>
</head>
<body>
  <h1>Dynamic Number Generator</h1>
  <button id="generateBtn" type="button">Generate</button>
  <ol id="numberList"></ol>

  <script>
    const generateBtn = document.getElementById("generateBtn");
    const numberList = document.getElementById("numberList");

    function generateNumbers() {
      numberList.textContent = "";          // clear old items to avoid duplicates

      for (let i = 1; i <= 5; i++) {
        const li = document.createElement("li");
        li.textContent = "The number is " + i;
        numberList.appendChild(li);
      }
    }

    generateBtn.addEventListener("click", generateNumbers);
  </script>
</body>
</html>
